name = "modwarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

# Pinned so every deploy uses this database (created in APAC, near the users) and never provisions a new empty one.
[[d1_databases]]
binding = "DB"
database_name = "modwarden-db-apac"
database_id = "90bb7971-01cb-4653-9541-9a5ea6105893"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[kv_namespaces]]
binding = "ATTACHMENTS_KV"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
