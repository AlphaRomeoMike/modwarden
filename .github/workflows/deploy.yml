name: Deploy to Cloudflare

# Runs when a v* tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
# To redeploy a tag: gh workflow run deploy.yml --ref v1.2.3
# Needs secret CLOUDFLARE_API_TOKEN (in the "production" environment), scoped to the one Cloudflare account to deploy to.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ModWarden (production)
    runs-on: ubuntu-latest
    # Only tags reach production, also when started by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    # The token can live in this environment, and the environment can require approval before deploying.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # KV storage mode: no R2 (and no card on file) needed. Creates D1 + KV on first run, reuses them after.
      - name: Deploy Worker
        run: npm run deploy:kv

      # Generated once inside the runner and never printed; later runs keep the existing secret.
      - name: Create JWT_SECRET on first deploy
        run: |
          if ! npx wrangler secret list -c wrangler.kv.toml | grep -q '"JWT_SECRET"'; then
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET -c wrangler.kv.toml
          fi
